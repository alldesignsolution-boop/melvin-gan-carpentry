<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melvin Gan Carpentry — Checklists</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@200&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fa; color: #1a1a2e; }
  nav { background: #f0ebe1; padding: 16px 32px; display: flex; align-items: center; gap: 24px; }
  .nav-logo { font-family: 'Raleway', sans-serif; font-weight: 200; font-size: 19px; letter-spacing: 4px; color: #1a1a2e; white-space: nowrap; flex-shrink: 0; text-decoration: none; }
  nav a { color: #7a6352; text-decoration: none; font-size: 14px; }
  nav a:hover, nav a.active { color: #1a1a2e; }
  nav .spacer { flex: 1; }
  .user-badge { font-size: 12px; color: #7a6352; }
  nav button.logout { background: none; border: 1px solid #c9b9a5; color: #7a6352; padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

  .main { padding: 28px 20px 60px; max-width: 1020px; margin: 0 auto; }
  .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .top-bar h2 { font-size: 20px; font-weight: 800; }
  .filter-pill { display: none; align-items: center; gap: 8px; background: #f0ebe1; color: #4a3b30; font-size: 13px; padding: 5px 12px; border-radius: 20px; }
  .filter-pill a { color: #7a6352; text-decoration: none; font-weight: 700; }
  .count-badge { background: #f0ebe1; color: #4a3b30; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; }

  /* Composer */
  .composer { max-width: 560px; margin: 0 auto 28px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 1px 5px rgba(0,0,0,.07); }
  .composer .collapsed { display: flex; align-items: center; gap: 10px; padding: 13px 16px; color: #8a7364; font-size: 14px; cursor: text; }
  .composer .expanded { display: none; padding: 12px 14px; }
  .composer.open .collapsed { display: none; }
  .composer.open .expanded { display: block; }
  .composer input.title-inp { width: 100%; border: none; outline: none; font-size: 15px; font-weight: 600; padding: 4px 4px 10px; font-family: inherit; }
  .composer .new-items { list-style: none; }
  .composer .new-item { display: flex; align-items: center; gap: 9px; padding: 3px 0; }
  .composer .new-item input { flex: 1; border: none; outline: none; font-size: 14px; padding: 4px 2px; font-family: inherit; border-bottom: 1px solid transparent; }
  .composer .new-item input:focus { border-bottom-color: #d3c3ae; }
  .composer .add-line { display: flex; align-items: center; gap: 9px; color: #8a7364; font-size: 13px; padding: 6px 0; cursor: pointer; }
  .composer .comp-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0ebe1; }
  .composer select { padding: 6px 9px; border: 1px solid #e5e7eb; border-radius: 7px; font-size: 12px; background: #fff; font-family: inherit; }

  .checkbox { width: 17px; height: 17px; flex-shrink: 0; border: 1.6px solid #c9b9a5; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; background: #fff; }
  .checkbox.on { background: #7a6352; border-color: #7a6352; }
  .checkbox.on::after { content: "✓"; color: #fff; font-size: 11px; line-height: 1; }

  button.primary { background: #4a3b30; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
  button.primary:hover { background: #33291f; }
  button.ghost { background: none; border: none; color: #8a7364; font-size: 13px; cursor: pointer; padding: 6px 8px; border-radius: 6px; }
  button.ghost:hover { background: #f0ebe1; }

  .section-label { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .6px; color: #8a7364; text-transform: uppercase; margin: 4px 2px 10px; }
  .board { column-count: 3; column-gap: 15px; }
  @media(max-width:900px){ .board { column-count: 2; } }

  .card { break-inside: avoid; background: #fff; border: 1px solid #e8e2d6; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); padding: 13px 14px 8px; margin-bottom: 15px; position: relative; }
  .card[data-color="beige"] { background: #f0ebe1; }
  .card[data-color="sand"]  { background: #faf7f2; }
  .card[data-color="green"] { background: #e8f0e6; }
  .card[data-color="peach"] { background: #fdeee2; }
  .card[data-color="blue"]  { background: #eef0f6; }
  .card.pinned-card { border-top: 4px solid #4a3b30; }
  .card .card-head { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 9px; }
  .card .card-title { flex: 1; font-weight: 600; font-size: 15px; outline: none; word-break: break-word; }
  .card .card-title:empty::before { content: "Title"; color: #b8a68f; }
  .card .pin-btn { background: none; border: none; cursor: pointer; color: #c9b9a5; font-size: 16px; line-height: 1; padding: 2px; }
  .card .pin-btn.on { color: #4a3b30; }

  .card ul.items { list-style: none; }
  .card .item { display: flex; align-items: flex-start; gap: 9px; padding: 4px 0; }
  .card .item .txt { flex: 1; font-size: 13.5px; line-height: 1.35; outline: none; word-break: break-word; }
  .card .item.done .txt { color: #a99e8f; text-decoration: line-through; }
  .card .item .del-item { visibility: hidden; background: none; border: none; color: #b8a68f; cursor: pointer; font-size: 13px; padding: 0 2px; }
  .card .item:hover .del-item { visibility: visible; }
  .card .add-item { display: flex; align-items: center; gap: 9px; color: #8a7364; font-size: 13px; padding: 6px 0; cursor: text; }
  .card .completed-toggle { font-size: 11px; color: #8a7364; cursor: pointer; margin: 7px 0 3px; padding: 3px 0; border-top: 1px solid rgba(0,0,0,.06); user-select: none; }
  .card .card-foot { display: flex; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; min-height: 30px; }
  .card .lead-link { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #4a3b30; background: rgba(122,99,82,.12); padding: 3px 9px; border-radius: 20px; text-decoration: none; margin-right: auto; }
  .card .lead-link:hover { background: rgba(122,99,82,.2); }
  .card .foot-spacer { margin-right: auto; }
  .card .icon-btn { background: none; border: none; cursor: pointer; color: #8a7364; font-size: 15px; padding: 4px 6px; border-radius: 6px; line-height: 1; }
  .card .icon-btn:hover { background: rgba(0,0,0,.06); }

  .color-menu, .lead-menu { position: absolute; z-index: 20; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.14); padding: 8px; display: none; }
  .color-menu.open, .lead-menu.open { display: block; }
  .color-menu { display: flex; gap: 6px; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 1px solid #d3c3ae; }
  .swatch.sel { outline: 2px solid #4a3b30; outline-offset: 1px; }
  .lead-menu { min-width: 200px; max-height: 240px; overflow-y: auto; }
  .lead-menu select { width: 100%; padding: 7px; border: 1px solid #e5e7eb; border-radius: 7px; font-size: 13px; font-family: inherit; }

  .empty { text-align: center; color: #b8a68f; padding: 50px 20px; font-size: 14px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #10b981; color: white; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; display: none; z-index: 100; }
  .toast.error { background: #ef4444; }

  @media(max-width:640px){
    nav { padding: 8px 14px; gap: 8px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    nav::-webkit-scrollbar { display: none; }
    .nav-logo { font-size: 15px; letter-spacing: 3px; }
    nav a { font-size: 12px; white-space: nowrap; flex-shrink: 0; }
    nav .spacer { display: none; }
    nav button.logout { white-space: nowrap; flex-shrink: 0; font-size: 11px; padding: 4px 8px; }
    .main { padding: 16px 12px 50px; }
    .top-bar h2 { font-size: 17px; }
    .board { column-count: 1; }
    .composer { max-width: 100%; }
  }
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">melvin gan carpentry</a>
  <a href="/">Dashboard</a>
  <a href="/leads-page">All Leads</a>
  <a href="/quotes-page">Quotations</a>
  <a href="/checklists-page" class="active">Checklists</a>
  <a href="/admin/presets">Library</a>
  <div class="spacer"></div>
  <span class="user-badge" id="user-badge"></span>
  <form method="POST" action="/logout" style="margin:0">
    <button class="logout" type="submit">Sign out</button>
  </form>
</nav>

<div class="main">
  <div class="top-bar">
    <h2>Checklists</h2>
    <span class="count-badge" id="count-badge">0</span>
    <span class="filter-pill" id="filter-pill"></span>
  </div>

  <!-- Composer -->
  <div class="composer" id="composer">
    <div class="collapsed" onclick="openComposer()">
      <span style="font-size:16px">☑</span>
      <span style="flex:1">Take a note…</span>
      <span style="font-size:15px">＋</span>
    </div>
    <div class="expanded">
      <input class="title-inp" id="c-title" placeholder="Title" maxlength="200">
      <ul class="new-items" id="c-items"></ul>
      <div class="add-line" onclick="addComposerLine()"><span style="font-size:15px">＋</span> List item</div>
      <div class="comp-foot">
        <select id="c-color">
          <option value="white">Colour: Default</option>
          <option value="beige">Beige</option>
          <option value="sand">Sand</option>
          <option value="green">Sage</option>
          <option value="peach">Peach</option>
          <option value="blue">Slate</option>
        </select>
        <select id="c-lead"><option value="">No linked lead</option></select>
        <span style="flex:1"></span>
        <button class="ghost" onclick="closeComposer()">Cancel</button>
        <button class="primary" onclick="saveComposer()">Add checklist</button>
      </div>
    </div>
  </div>

  <div id="board-wrap">
    <div class="empty" id="loading">Loading…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const COLORS = { white:"#ffffff", beige:"#f0ebe1", sand:"#faf7f2", green:"#e8f0e6", peach:"#fdeee2", blue:"#eef0f6" };
let checklists = [];
let leads = [];
let _viewer = false;
let filterLeadId = new URLSearchParams(location.search).get("lead_id");
if (filterLeadId !== null) filterLeadId = parseInt(filterLeadId, 10);

function toast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast" + (err ? " error" : "");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2400);
}
async function api(method, url, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const res = await fetch(url, opt);
  if (!res.ok) { throw new Error((await res.text()) || res.status); }
  return res.status === 204 ? null : res.json();
}
function esc(s) { return (s||"").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function leadName(id) { const l = leads.find(x => x.id === id); return l ? l.full_name : ("Lead #" + id); }

async function load() {
  try {
    const me = await fetch("/me").then(r => r.json());
    _viewer = me.role === "viewer";
    document.getElementById("user-badge").textContent = me.username || "";
  } catch(e) {}
  try { leads = await fetch("/leads").then(r => r.json()); } catch(e) { leads = []; }
  fillLeadSelect(document.getElementById("c-lead"));
  if (_viewer) document.getElementById("composer").style.display = "none";

  if (filterLeadId) {
    const pill = document.getElementById("filter-pill");
    pill.style.display = "inline-flex";
    pill.innerHTML = "Linked to " + esc(leadName(filterLeadId)) + " · <a href='/checklists-page'>show all</a>";
    const cl = document.getElementById("c-lead");
    cl.value = String(filterLeadId); cl.disabled = true;
  }

  await refresh();
}

function fillLeadSelect(sel, selected) {
  sel.innerHTML = "<option value=''>No linked lead</option>" +
    leads.map(l => `<option value="${l.id}"${selected===l.id?" selected":""}>${esc(l.full_name)}</option>`).join("");
}

async function refresh() {
  const url = filterLeadId ? ("/checklists?lead_id=" + filterLeadId) : "/checklists";
  checklists = await api("GET", url);
  render();
}

function render() {
  const wrap = document.getElementById("board-wrap");
  document.getElementById("count-badge").textContent = checklists.length;
  if (!checklists.length) {
    wrap.innerHTML = "<div class='empty'>No checklists yet. Use “Take a note…” above to create one.</div>";
    return;
  }
  const pinned = checklists.filter(c => c.pinned);
  const others = checklists.filter(c => !c.pinned);
  let html = "";
  if (pinned.length && others.length) {
    html += "<div class='section-label'>📌 Pinned</div><div class='board'>" + pinned.map(cardHtml).join("") + "</div>";
    html += "<div class='section-label'>Others</div><div class='board'>" + others.map(cardHtml).join("") + "</div>";
  } else {
    html += "<div class='board'>" + checklists.map(cardHtml).join("") + "</div>";
  }
  wrap.innerHTML = html;
}

function cardHtml(c) {
  const active = c.items.filter(i => !i.done);
  const done = c.items.filter(i => i.done);
  const dis = _viewer ? "" : "contenteditable='true'";
  const itemRow = (i) => `
    <li class="item ${i.done?'done':''}" data-id="${i.id}">
      <span class="checkbox ${i.done?'on':''}" onclick="toggleItem(${i.id}, ${!i.done})"></span>
      <span class="txt" ${dis} onblur="editItem(${i.id}, this.innerText)">${esc(i.text)}</span>
      ${_viewer?"":`<button class="del-item" onclick="delItem(${i.id})" title="Delete">✕</button>`}
    </li>`;
  let doneBlock = "";
  if (done.length) {
    doneBlock = `<div class="completed-toggle" onclick="toggleDone(this)">▸ ${done.length} completed item${done.length>1?'s':''}</div>
      <ul class="items done-items" style="display:none">${done.map(itemRow).join("")}</ul>`;
  }
  const leadTag = c.lead_id
    ? `<a class="lead-link" href="/lead/${c.lead_id}" title="Open lead">🔗 ${esc(c.lead_name || leadName(c.lead_id))}</a>`
    : `<span class="foot-spacer"></span>`;
  const foot = _viewer ? "" : `
    <div class="card-foot">
      ${leadTag}
      <button class="icon-btn" onclick="openColor(this, ${c.id})" title="Colour">🎨</button>
      <button class="icon-btn" onclick="openLead(this, ${c.id})" title="Link lead">🔗</button>
      <button class="icon-btn" onclick="delCard(${c.id})" title="Delete">🗑</button>
    </div>`;
  const viewerFoot = _viewer && c.lead_id ? `<div class="card-foot">${leadTag}</div>` : "";
  return `
    <div class="card ${c.pinned?'pinned-card':''}" data-color="${c.color}" data-id="${c.id}">
      <div class="card-head">
        <div class="card-title" ${dis} onblur="editTitle(${c.id}, this.innerText)">${esc(c.title)}</div>
        ${_viewer?"":`<button class="pin-btn ${c.pinned?'on':''}" onclick="togglePin(${c.id}, ${!c.pinned})" title="Pin">📌</button>`}
      </div>
      <ul class="items">${active.map(itemRow).join("")}</ul>
      ${_viewer?"":`<div class="add-item" onclick="addItemPrompt(${c.id})"><span style="font-size:14px">＋</span> List item</div>`}
      ${doneBlock}
      ${foot || viewerFoot}
    </div>`;
}

function toggleDone(el) {
  const ul = el.nextElementSibling;
  const open = ul.style.display !== "none";
  ul.style.display = open ? "none" : "block";
  el.textContent = el.textContent.replace(open ? "▾" : "▸", open ? "▸" : "▾");
  if (!el.textContent.startsWith("▸") && !el.textContent.startsWith("▾"))
    el.textContent = (open ? "▸ " : "▾ ") + el.textContent;
}

/* ---- Composer ---- */
function openComposer() {
  if (_viewer) return;
  document.getElementById("composer").classList.add("open");
  if (!document.querySelectorAll("#c-items .new-item").length) addComposerLine();
  document.getElementById("c-title").focus();
}
function closeComposer() {
  const comp = document.getElementById("composer");
  comp.classList.remove("open");
  document.getElementById("c-title").value = "";
  document.getElementById("c-items").innerHTML = "";
  document.getElementById("c-color").value = "white";
  if (!filterLeadId) document.getElementById("c-lead").value = "";
}
function addComposerLine(focus = true) {
  const li = document.createElement("li");
  li.className = "new-item";
  li.innerHTML = `<span class="checkbox"></span><input placeholder="List item" maxlength="500">`;
  const inp = li.querySelector("input");
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); addComposerLine(); }
    if (e.key === "Backspace" && inp.value === "" && document.querySelectorAll("#c-items .new-item").length > 1) {
      const prev = li.previousElementSibling; li.remove(); if (prev) prev.querySelector("input").focus();
    }
  });
  document.getElementById("c-items").appendChild(li);
  if (focus) inp.focus();
}
async function saveComposer() {
  const title = document.getElementById("c-title").value.trim();
  const items = [...document.querySelectorAll("#c-items .new-item input")].map(i => i.value.trim()).filter(Boolean);
  if (!title && !items.length) { closeComposer(); return; }
  const leadVal = document.getElementById("c-lead").value;
  try {
    await api("POST", "/checklists", {
      title, items,
      color: document.getElementById("c-color").value,
      lead_id: leadVal ? parseInt(leadVal, 10) : null,
    });
    closeComposer();
    await refresh();
    toast("Checklist added");
  } catch(e) { toast("Could not save: " + e.message, true); }
}

/* ---- Card actions ---- */
async function editTitle(id, text) {
  const c = checklists.find(x => x.id === id); if (!c || c.title === text.trim()) return;
  try { await api("PATCH", "/checklists/" + id, { title: text.trim() }); c.title = text.trim(); }
  catch(e) { toast("Save failed", true); }
}
async function togglePin(id, val) {
  try { await api("PATCH", "/checklists/" + id, { pinned: val }); await refresh(); }
  catch(e) { toast("Save failed", true); }
}
async function delCard(id) {
  if (!confirm("Delete this checklist?")) return;
  try { await api("DELETE", "/checklists/" + id); await refresh(); toast("Deleted"); }
  catch(e) { toast("Delete failed", true); }
}
async function setColor(id, color) {
  try { await api("PATCH", "/checklists/" + id, { color }); const c = checklists.find(x=>x.id===id); if(c) c.color = color;
    const card = document.querySelector(`.card[data-id="${id}"]`); if (card) card.dataset.color = color; closeMenus(); }
  catch(e) { toast("Save failed", true); }
}
async function setLead(id, leadVal) {
  const body = leadVal ? { lead_id: parseInt(leadVal,10) } : { clear_lead: true };
  try { await api("PATCH", "/checklists/" + id, body); closeMenus(); await refresh(); }
  catch(e) { toast("Save failed", true); }
}

/* ---- Item actions ---- */
async function toggleItem(id, val) {
  try { await api("PATCH", "/checklists/items/" + id, { done: val }); await refresh(); }
  catch(e) { toast("Save failed", true); }
}
async function editItem(id, text) {
  try { await api("PATCH", "/checklists/items/" + id, { text: text.trim() }); }
  catch(e) { toast("Save failed", true); }
}
async function delItem(id) {
  try { await api("DELETE", "/checklists/items/" + id); await refresh(); }
  catch(e) { toast("Delete failed", true); }
}
async function addItemPrompt(cid) {
  const text = prompt("New list item:");
  if (text === null || !text.trim()) return;
  try { await api("POST", "/checklists/" + cid + "/items", { text: text.trim() }); await refresh(); }
  catch(e) { toast("Add failed", true); }
}

/* ---- Popup menus ---- */
function closeMenus() { document.querySelectorAll(".color-menu,.lead-menu").forEach(m => m.remove()); }
function openColor(btn, id) {
  closeMenus();
  const c = checklists.find(x => x.id === id);
  const menu = document.createElement("div");
  menu.className = "color-menu open";
  menu.innerHTML = Object.entries(COLORS).map(([k,v]) =>
    `<span class="swatch ${c.color===k?'sel':''}" style="background:${v}" onclick="setColor(${id},'${k}')" title="${k}"></span>`).join("");
  positionMenu(btn, menu);
}
function openLead(btn, id) {
  closeMenus();
  const c = checklists.find(x => x.id === id);
  const menu = document.createElement("div");
  menu.className = "lead-menu open";
  const sel = document.createElement("select");
  fillLeadSelect(sel, c.lead_id);
  sel.onchange = () => setLead(id, sel.value);
  menu.appendChild(sel);
  positionMenu(btn, menu);
}
function positionMenu(btn, menu) {
  const card = btn.closest(".card");
  card.appendChild(menu);
  const br = btn.getBoundingClientRect(), cr = card.getBoundingClientRect();
  menu.style.top = (br.bottom - cr.top + 4) + "px";
  menu.style.right = "8px";
}
document.addEventListener("click", e => {
  if (!e.target.closest(".color-menu,.lead-menu,.icon-btn")) closeMenus();
});

load();
</script>
</body>
</html>
